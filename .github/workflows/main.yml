name: Main CI Workflow

on: push


jobs:
  build-test-eslint-node-22:
    name: Build, Test & Eslint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: yarn install
      - run: yarn build
      - run: yarn test
      - run: yarn eslint
